# netlify.toml — Wainwright Realty
# Regenerates the site from build.py, rebuilds the posts index, then serves /site.
#
# build.py is the source of truth for every page in site/. Running it here means
# the generated index.html files no longer have to be committed by hand -- edit
# build.py / build_pages.py, push, and Netlify renders the 27 pages on deploy.

[build]
  command = "python build.py && python scripts/build_posts_index.py"
  publish = "site"

# ── Netlify Identity: let the admin panel handle its own routing ──
[[redirects]]
  from  = "/admin"
  to    = "/admin/index.html"
  status = 200

# ── Blog post URLs: /blog/my-post-slug/ → post.html (JS reads the slug) ──
[[redirects]]
  from  = "/blog/:slug"
  to    = "/blog/post.html"
  status = 200

[[redirects]]
  from  = "/blog/:slug/"
  to    = "/blog/post.html"
  status = 200
