# Netlify configuration — David Wainwright Jr static site
[build]
  publish = "."

# Long-cache only fingerprint-free media; let CSS/JS revalidate via ETag (Netlify default).
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
