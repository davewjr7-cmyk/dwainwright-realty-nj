<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="pageTitle">Loading… | Wainwright Realty</title>
  <meta name="description" id="pageDesc" content="" />

  <!-- Netlify Identity -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

  <!-- Markdown renderer -->
  <script src="https://cdn.jsdelivr.net/npm/marked@9.1.6/marked.min.js"></script>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <!-- Site stylesheet -->
  <link rel="stylesheet" href="/assets/css/style.css" />

  <style>
    /* ── Post page layout ── */
    .post-page { max-width: 760px; margin: 0 auto; padding: 0 20px 80px; }

    /* ── Back link ── */
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: 'Raleway', sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #af7b34;
      text-decoration: none;
      padding: 28px 0 0;
      display: block;
    }
    .back-link:hover { color: #f6d675; }

    /* ── Post hero ── */
    .post-hero-img {
      width: 100%;
      max-height: 420px;
      object-fit: cover;
      border-radius: 6px;
      margin: 24px 0 32px;
      border: 1px solid #2a2a2a;
    }

    /* ── Post meta ── */
    .post-meta {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }
    .post-meta-cat {
      font-family: 'Raleway', sans-serif;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #fff;
      background: #af7b34;
      padding: 4px 12px;
      border-radius: 3px;
    }
    .post-meta-date, .post-meta-author {
      font-family: 'Inter', sans-serif;
      font-size: 0.82rem;
      color: #666;
    }

    /* ── Post title ── */
    .post-title {
      font-family: 'Raleway', sans-serif;
      font-size: clamp(1.7rem, 4vw, 2.5rem);
      font-weight: 900;
      color: #f0f0f0;
      line-height: 1.25;
      margin: 12px 0 28px;
    }

    /* ── Divider ── */
    .post-divider {
      border: none;
      border-top: 1px solid #2a2a2a;
      margin: 0 0 32px;
    }

    /* ── Post body prose ── */
    .post-body {
      font-family: 'Inter', sans-serif;
      font-size: 1.02rem;
      line-height: 1.75;
      color: #ccc;
    }
    .post-body h1, .post-body h2, .post-body h3, .post-body h4 {
      font-family: 'Raleway', sans-serif;
      color: #f0f0f0;
      margin-top: 2em;
      margin-bottom: 0.5em;
    }
    .post-body h2 { font-size: 1.4rem; font-weight: 800; border-bottom: 1px solid #2a2a2a; padding-bottom: 8px; }
    .post-body h3 { font-size: 1.15rem; font-weight: 700; color: #e1c281; }
    .post-body p { margin: 0 0 1.25em; }
    .post-body a { color: #f6d675; text-decoration: underline; }
    .post-body a:hover { color: #fff; }
    .post-body strong { color: #f0f0f0; }
    .post-body em { color: #aaa; }
    .post-body ul, .post-body ol { padding-left: 1.5em; margin-bottom: 1.25em; }
    .post-body li { margin-bottom: 0.5em; }
    .post-body blockquote {
      border-left: 3px solid #f6d675;
      margin: 1.5em 0;
      padding: 12px 20px;
      background: rgba(246,214,117,0.04);
      color: #bbb;
      font-style: italic;
    }
    .post-body code {
      font-family: monospace;
      background: #1a1a1a;
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 0.9em;
      color: #f6d675;
    }
    .post-body pre {
      background: #111;
      border: 1px solid #2a2a2a;
      border-radius: 6px;
      padding: 20px;
      overflow-x: auto;
    }
    .post-body pre code { background: none; padding: 0; }
    .post-body img {
      max-width: 100%;
      height: auto;
      border-radius: 6px;
      margin: 1em 0;
    }
    .post-body hr { border: none; border-top: 1px solid #2a2a2a; margin: 2em 0; }

    /* ── CTA footer ── */
    .post-cta {
      margin-top: 56px;
      padding: 36px 32px;
      background: #111;
      border: 1px solid #2a2a2a;
      border-left: 3px solid #f6d675;
      border-radius: 6px;
    }
    .post-cta h4 {
      font-family: 'Raleway', sans-serif;
      font-size: 1.05rem;
      font-weight: 800;
      color: #f6d675;
      margin: 0 0 8px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .post-cta p {
      font-family: 'Inter', sans-serif;
      color: #999;
      font-size: 0.92rem;
      margin: 0 0 18px;
    }
    .post-cta a {
      display: inline-block;
      font-family: 'Raleway', sans-serif;
      font-weight: 700;
      font-size: 0.85rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #0a0a0a;
      background: #f6d675;
      padding: 10px 24px;
      border-radius: 4px;
      text-decoration: none;
      margin-right: 12px;
    }
    .post-cta a:hover { background: #fff; }

    /* ── Error state ── */
    .post-error {
      text-align: center;
      padding: 80px 20px;
      color: #666;
      font-family: 'Raleway', sans-serif;
    }
    .post-error h2 { color: #888; }

    @media (max-width: 600px) {
      .post-page { padding: 0 14px 60px; }
      .post-cta { padding: 24px 20px; }
    }
  </style>
</head>
<body>

<div class="post-page">

  <a class="back-link" href="/blog/">← Back to Market Insights</a>

  <div id="postContent">
    <div class="post-error" id="loading">
      <p style="color:#555;">Loading post…</p>
    </div>
  </div>

</div>

<script>
  // ── Netlify Identity redirect ──
  if (window.netlifyIdentity) {
    window.netlifyIdentity.on("init", user => {
      if (!user) {
        window.netlifyIdentity.on("login", () => {
          document.location.href = "/admin/";
        });
      }
    });
  }

  // ── Parse frontmatter from Markdown ──
  function parseFrontmatter(raw) {
    if (!raw.startsWith('---')) return { meta: {}, body: raw };
    const parts = raw.split('---');
    if (parts.length < 3) return { meta: {}, body: raw };
    const meta = {};
    parts[1].trim().split('\n').forEach(line => {
      const idx = line.indexOf(':');
      if (idx > 0) {
        const key = line.slice(0, idx).trim();
        const val = line.slice(idx + 1).trim().replace(/^["']|["']$/g, '');
        meta[key] = val;
      }
    });
    return { meta, body: parts.slice(2).join('---').trim() };
  }

  // ── Format date ──
  function fmtDate(str) {
    if (!str) return '';
    const d = new Date(str);
    return d.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
  }

  // ── Get slug from URL ──
  // URL pattern: /blog/my-post-slug/ → slug = my-post-slug
  function getSlug() {
    const path = window.location.pathname.replace(/\/$/, '');
    const parts = path.split('/');
    return parts[parts.length - 1];
  }

  // ── Render the post ──
  function renderPost(slug, raw) {
    const { meta, body } = parseFrontmatter(raw);
    const html = marked.parse(body);

    // Update page title and meta
    document.getElementById('pageTitle').textContent =
      (meta.title || 'Post') + ' | Wainwright Realty';
    document.getElementById('pageDesc').setAttribute('content', meta.summary || '');

    const imgHtml = meta.image
      ? `<img class="post-hero-img" src="${meta.image}" alt="${meta.title || ''}" />`
      : '';

    document.getElementById('postContent').innerHTML = `
      ${imgHtml}
      <div class="post-meta">
        ${meta.category ? `<span class="post-meta-cat">${meta.category}</span>` : ''}
        ${meta.date ? `<span class="post-meta-date">${fmtDate(meta.date)}</span>` : ''}
        ${meta.author ? `<span class="post-meta-author">By ${meta.author}</span>` : ''}
      </div>
      <h1 class="post-title">${meta.title || ''}</h1>
      <hr class="post-divider" />
      <div class="post-body">${html}</div>
      <div class="post-cta">
        <h4>Questions? Let's Talk.</h4>
        <p>David Wainwright Jr. | NRBA Master Broker — NJ | Wainwright Realty (RE/MAX Select, Morris)</p>
        <a href="/contact/">Contact Dave</a>
        <a href="tel:9738187100" style="background:#1a1208; color:#f6d675; border:1px solid #af7b34;">973-818-7100</a>
      </div>`;
  }

  // ── Fetch and load the post ──
  const slug = getSlug();
  if (!slug || slug === 'post') {
    document.getElementById('loading').innerHTML =
      '<h2>Post not found</h2><p><a href="/blog/" style="color:#f6d675;">← Back to Market Insights</a></p>';
  } else {
    fetch(`/blog/posts/${slug}.md`)
      .then(r => {
        if (!r.ok) throw new Error('not found');
        return r.text();
      })
      .then(raw => renderPost(slug, raw))
      .catch(() => {
        document.getElementById('postContent').innerHTML = `
          <div class="post-error">
            <h2>Post not found</h2>
            <p>This post may have moved or been removed.</p>
            <a href="/blog/" style="color:#f6d675;">← Back to Market Insights</a>
          </div>`;
      });
  }
</script>
</body>
</html>
