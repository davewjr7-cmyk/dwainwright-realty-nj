<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Market Insights | Wainwright Realty</title>
  <meta name="description" content="Real estate market updates, REO news, commercial insights and tips from David Wainwright Jr. — Wainwright Realty, Morris County NJ." />

  <!-- Netlify Identity (handles CMS login redirect) -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <!-- Site stylesheet (inherits nav, footer, base styles) -->
  <link rel="stylesheet" href="/assets/css/style.css" />

  <style>
    /* ── Blog-specific overrides ── */
    .blog-hero {
      background: linear-gradient(135deg, #0a0a0a 0%, #1a1208 100%);
      border-bottom: 2px solid #af7b34;
      padding: 60px 20px 50px;
      text-align: center;
    }
    .blog-hero h1 {
      font-family: 'Raleway', sans-serif;
      font-size: clamp(2rem, 5vw, 3.2rem);
      font-weight: 900;
      color: #f6d675;
      margin: 0 0 12px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .blog-hero p {
      font-family: 'Inter', sans-serif;
      color: #c8a86b;
      font-size: 1.05rem;
      max-width: 560px;
      margin: 0 auto;
    }

    /* ── Filter bar ── */
    .filter-bar {
      background: #111;
      border-bottom: 1px solid #2a2a2a;
      padding: 14px 20px;
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .filter-btn {
      font-family: 'Raleway', sans-serif;
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 6px 16px;
      border: 1px solid #3a3a3a;
      border-radius: 20px;
      background: transparent;
      color: #999;
      cursor: pointer;
      transition: all 0.2s;
    }
    .filter-btn:hover, .filter-btn.active {
      border-color: #f6d675;
      color: #f6d675;
      background: rgba(246,214,117,0.06);
    }

    /* ── Posts grid ── */
    .posts-section {
      max-width: 1100px;
      margin: 0 auto;
      padding: 50px 20px 80px;
    }
    .posts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 32px;
    }

    /* ── Post card ── */
    .post-card {
      background: #111;
      border: 1px solid #222;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, border-color 0.2s;
      text-decoration: none;
    }
    .post-card:hover {
      transform: translateY(-4px);
      border-color: #af7b34;
    }
    .post-card-img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      display: block;
      background: #1a1a1a;
    }
    .post-card-img-placeholder {
      width: 100%;
      height: 200px;
      background: linear-gradient(135deg, #1a1208, #0f1a0a);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .post-card-img-placeholder svg {
      opacity: 0.15;
    }
    .post-card-body {
      padding: 22px 24px 24px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .post-card-cat {
      font-family: 'Raleway', sans-serif;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #af7b34;
      margin-bottom: 8px;
    }
    .post-card-title {
      font-family: 'Raleway', sans-serif;
      font-size: 1.12rem;
      font-weight: 700;
      color: #f0f0f0;
      line-height: 1.4;
      margin: 0 0 10px;
    }
    .post-card-summary {
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      color: #888;
      line-height: 1.55;
      flex: 1;
      margin-bottom: 16px;
    }
    .post-card-meta {
      font-family: 'Inter', sans-serif;
      font-size: 0.78rem;
      color: #555;
      display: flex;
      justify-content: space-between;
      border-top: 1px solid #222;
      padding-top: 12px;
      margin-top: auto;
    }
    .post-card-read-more {
      color: #f6d675;
      font-weight: 600;
      font-size: 0.82rem;
      letter-spacing: 0.04em;
    }

    /* ── Empty / loading states ── */
    .posts-empty {
      text-align: center;
      padding: 80px 20px;
      color: #555;
      font-family: 'Inter', sans-serif;
    }
    .posts-empty h3 {
      color: #888;
      font-size: 1.1rem;
      font-weight: 500;
    }
    .posts-loading {
      text-align: center;
      padding: 80px 20px;
      color: #666;
      font-family: 'Raleway', sans-serif;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 0.85rem;
    }

    @media (max-width: 600px) {
      .posts-grid { grid-template-columns: 1fr; }
      .blog-hero { padding: 40px 16px 36px; }
    }
  </style>
</head>
<body>

<!-- Inline the site's existing nav here if needed -->

<div class="blog-hero">
  <h1>Market Insights</h1>
  <p>Real estate news, market data, and expert perspective from David Wainwright Jr. — Morris County, NJ</p>
</div>

<div class="filter-bar" id="filterBar">
  <button class="filter-btn active" data-cat="all">All Posts</button>
  <!-- Categories injected by JS -->
</div>

<section class="posts-section">
  <div class="posts-loading" id="loading">Loading posts…</div>
  <div class="posts-grid" id="postsGrid" style="display:none;"></div>
  <div class="posts-empty" id="emptyState" style="display:none;">
    <h3>No posts yet in this category.</h3>
    <p>Check back soon.</p>
  </div>
</section>

<!-- Inline the site's existing footer here if needed -->

<script>
  // ── Netlify Identity redirect ──
  if (window.netlifyIdentity) {
    window.netlifyIdentity.on("init", user => {
      if (!user) {
        window.netlifyIdentity.on("login", () => {
          document.location.href = "/admin/";
        });
      }
    });
  }

  // ── Format date ──
  function fmtDate(str) {
    if (!str) return '';
    const d = new Date(str);
    return d.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
  }

  // ── Build a post card ──
  function makeCard(post) {
    const href = `/blog/${post.slug}/`;
    const imgHtml = post.image
      ? `<img class="post-card-img" src="${post.image}" alt="${post.title}" loading="lazy" />`
      : `<div class="post-card-img-placeholder">
           <svg width="64" height="64" viewBox="0 0 24 24" fill="#f6d675"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
         </div>`;
    return `
      <a class="post-card" href="${href}">
        ${imgHtml}
        <div class="post-card-body">
          <div class="post-card-cat">${post.category || 'Market Update'}</div>
          <div class="post-card-title">${post.title}</div>
          <div class="post-card-summary">${post.summary || ''}</div>
          <div class="post-card-meta">
            <span>${fmtDate(post.date)}</span>
            <span class="post-card-read-more">Read more →</span>
          </div>
        </div>
      </a>`;
  }

  // ── Render posts ──
  let allPosts = [];
  let activeCategory = 'all';

  function renderPosts() {
    const grid = document.getElementById('postsGrid');
    const empty = document.getElementById('emptyState');
    const filtered = activeCategory === 'all'
      ? allPosts
      : allPosts.filter(p => p.category === activeCategory);
    if (filtered.length === 0) {
      grid.style.display = 'none';
      empty.style.display = 'block';
    } else {
      empty.style.display = 'none';
      grid.style.display = 'grid';
      grid.innerHTML = filtered
        .sort((a, b) => new Date(b.date) - new Date(a.date))
        .map(makeCard).join('');
    }
  }

  // ── Build filter buttons from categories ──
  function buildFilters(posts) {
    const cats = [...new Set(posts.map(p => p.category).filter(Boolean))];
    const bar = document.getElementById('filterBar');
    cats.forEach(cat => {
      const btn = document.createElement('button');
      btn.className = 'filter-btn';
      btn.dataset.cat = cat;
      btn.textContent = cat;
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeCategory = cat;
        renderPosts();
      });
      bar.appendChild(btn);
    });
    document.querySelector('[data-cat="all"]').addEventListener('click', () => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      document.querySelector('[data-cat="all"]').classList.add('active');
      activeCategory = 'all';
      renderPosts();
    });
  }

  // ── Fetch posts index ──
  fetch('/blog/posts/posts.json')
    .then(r => r.ok ? r.json() : [])
    .then(posts => {
      document.getElementById('loading').style.display = 'none';
      allPosts = posts;
      buildFilters(posts);
      renderPosts();
    })
    .catch(() => {
      document.getElementById('loading').textContent = 'No posts yet — check back soon.';
    });
</script>
</body>
</html>
